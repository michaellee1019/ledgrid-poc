[project]
name = "ledgrid-poc"
version = "0.1.0"
description = "Host and receiver software for the LED plant wall"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.2,<4",
    "numpy>=2.2.6,<3",
    "pillow>=10,<13",
    "pyserial>=3.5,<4",
    "smbus2>=0.4,<1",
    "spidev>=3.6,<4; sys_platform == 'linux'",
    "werkzeug>=3.1.3,<4",
]

[dependency-groups]
test = [
    "pytest>=8.4.2,<10",
]
calibration = [
    "opencv-python-headless>=4.10,<5",
]
firmware = [
    "platformio==6.1.19",
]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests", "animation"]
