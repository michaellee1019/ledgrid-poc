[platformio]
src_dir = .
boards_dir = ../../../vendor/scorebot/boards

[env]
platform = espressif32@6.3.2
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.3.4
build_src_filter = +<radio.cpp>
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -I../../../vendor/scorebot/lib/scorebot/src
upload_speed = 57600

[env:peripheral]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DTEST_LEADER_MAC=${sysenv.SCOREBOT_TEST_LEADER_MAC}

; The connected e-paper board uses its external CH343 UART, so CDC remains off.
[env:central]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = ${env.build_flags} -DTEST_CENTRAL=1
