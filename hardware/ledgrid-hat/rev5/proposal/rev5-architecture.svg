<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">LED Grid Wall HAT Rev5 proposed architecture</title>
  <desc id="desc">A Raspberry Pi drives receiver A over SPI0 and receiver B over SPI1. Separate buck converters power the ESP32 modules, which drive sixteen buffered LED data and ground pairs.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .panel { fill: #ffffff; stroke: #26364a; stroke-width: 3; rx: 18; }
      .pi { fill: #e9f6ee; stroke: #186b3c; stroke-width: 3; rx: 18; }
      .rxA { fill: #eaf2ff; stroke: #245da8; stroke-width: 3; rx: 18; }
      .rxB { fill: #f0eaff; stroke: #6741a5; stroke-width: 3; rx: 18; }
      .power { fill: #fff5db; stroke: #9a6a00; stroke-width: 3; rx: 14; }
      .output { fill: #fff0ec; stroke: #a94329; stroke-width: 3; rx: 14; }
      .ground { fill: #e9edf2; stroke: #4d5a68; stroke-width: 2; rx: 12; }
      .title { font: 700 30px system-ui, sans-serif; fill: #162235; }
      .subtitle { font: 600 18px system-ui, sans-serif; fill: #a12a1d; }
      .head { font: 700 23px system-ui, sans-serif; fill: #172438; }
      .text { font: 16px system-ui, sans-serif; fill: #25364b; }
      .small { font: 14px system-ui, sans-serif; fill: #42536a; }
      .busA { stroke: #245da8; stroke-width: 6; fill: none; marker-end: url(#arrowA); }
      .busB { stroke: #6741a5; stroke-width: 6; fill: none; marker-end: url(#arrowB); }
      .pwr { stroke: #9a6a00; stroke-width: 5; fill: none; marker-end: url(#arrowP); }
      .data { stroke: #a94329; stroke-width: 5; fill: none; marker-end: url(#arrowD); }
      .gnd { stroke: #4d5a68; stroke-width: 4; stroke-dasharray: 10 7; fill: none; }
    </style>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#245da8"/></marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6741a5"/></marker>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9a6a00"/></marker>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a94329"/></marker>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text class="title" x="700" y="48" text-anchor="middle">LED Grid Wall HAT Rev5 — Proposed Electrical Architecture</text>
  <text class="subtitle" x="700" y="78" text-anchor="middle">NON-FABRICATION PROPOSAL · revised EDA source, ERC, DRC, and layout still required</text>

  <rect class="pi" x="55" y="175" width="285" height="420"/>
  <text class="head" x="197" y="215" text-anchor="middle">Raspberry Pi</text>
  <text class="text" x="85" y="260">SPI0 → Receiver A</text>
  <text class="small" x="85" y="290">MOSI GPIO10 / pin 19</text>
  <text class="small" x="85" y="315">MISO GPIO9 / pin 21</text>
  <text class="small" x="85" y="340">SCLK GPIO11 / pin 23</text>
  <text class="small" x="85" y="365">CE0 GPIO8 / pin 24</text>
  <text class="text" x="85" y="420">SPI1 → Receiver B</text>
  <text class="small" x="85" y="450">MOSI GPIO20 / pin 38</text>
  <text class="small" x="85" y="475">MISO GPIO19 / pin 35</text>
  <text class="small" x="85" y="500">SCLK GPIO21 / pin 40</text>
  <text class="small" x="85" y="525">CE0 GPIO18 / pin 12</text>
  <text class="small" x="85" y="565">5 V logic power only</text>

  <rect class="rxA" x="470" y="120" width="390" height="300"/>
  <text class="head" x="665" y="158" text-anchor="middle">Receiver A / SPI0</text>
  <rect class="power" x="505" y="185" width="150" height="88"/>
  <text class="text" x="580" y="218" text-anchor="middle">1 A buck</text>
  <text class="small" x="580" y="244" text-anchor="middle">5 V → local 3.3 V</text>
  <rect class="panel" x="680" y="185" width="145" height="88"/>
  <text class="text" x="752" y="218" text-anchor="middle">ESP32-S3</text>
  <text class="small" x="752" y="244" text-anchor="middle">GPIO10–13 SPI</text>
  <rect class="output" x="535" y="305" width="255" height="78"/>
  <text class="text" x="662" y="337" text-anchor="middle">2 × SN74HCT125 + 8 resistors</text>
  <text class="small" x="662" y="363" text-anchor="middle">LED1–LED8 · 5 V logic</text>

  <rect class="rxB" x="470" y="475" width="390" height="300"/>
  <text class="head" x="665" y="513" text-anchor="middle">Receiver B / SPI1</text>
  <rect class="power" x="505" y="540" width="150" height="88"/>
  <text class="text" x="580" y="573" text-anchor="middle">1 A buck</text>
  <text class="small" x="580" y="599" text-anchor="middle">5 V → local 3.3 V</text>
  <rect class="panel" x="680" y="540" width="145" height="88"/>
  <text class="text" x="752" y="573" text-anchor="middle">ESP32-S3</text>
  <text class="small" x="752" y="599" text-anchor="middle">GPIO10–13 SPI</text>
  <rect class="output" x="535" y="660" width="255" height="78"/>
  <text class="text" x="662" y="692" text-anchor="middle">2 × SN74HCT125 + 8 resistors</text>
  <text class="small" x="662" y="718" text-anchor="middle">LED9–LED16 · 5 V logic</text>

  <rect class="output" x="1015" y="270" width="325" height="360"/>
  <text class="head" x="1177" y="310" text-anchor="middle">CN1 LED interface</text>
  <text class="text" x="1050" y="355">34-position keyed header</text>
  <text class="text" x="1050" y="390">16 × data/ground pairs</text>
  <text class="text" x="1050" y="425">+ 2 additional grounds</text>
  <text class="text" x="1050" y="470">4 × optional 4-channel ESD</text>
  <text class="text" x="1050" y="515">68 Ω default source damping</text>
  <text class="subtitle" x="1177" y="570" text-anchor="middle">NO LED-STRIP POWER</text>

  <rect class="ground" x="380" y="820" width="620" height="48"/>
  <text class="text" x="690" y="850" text-anchor="middle">L2 uninterrupted ground plane beneath every critical route</text>

  <path class="busA" d="M340 300 H445 Q460 300 470 285"/>
  <text class="small" x="395" y="285" text-anchor="middle">4 point-to-point nets · 33 Ω at driver</text>
  <path class="busB" d="M340 470 H430 Q450 470 470 535"/>
  <text class="small" x="400" y="455" text-anchor="middle">4 point-to-point nets · 33 Ω at driver</text>
  <path class="pwr" d="M340 560 C405 560 420 225 505 225"/>
  <path class="pwr" d="M340 560 C405 560 420 580 505 580"/>
  <path class="data" d="M790 345 C900 345 920 390 1015 390"/>
  <path class="data" d="M790 700 C910 700 925 530 1015 530"/>
  <path class="gnd" d="M197 595 V844 H380"/>
  <path class="gnd" d="M665 420 V820"/>
  <path class="gnd" d="M665 775 V820"/>
  <path class="gnd" d="M1177 630 V844 H1000"/>
</svg>
