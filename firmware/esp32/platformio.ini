[platformio]
; Default to the ESP32-S3 DevKitC-1 board.
default_envs = esp32-s3-devkitc-1
; Allow environment variables to control build flags
extra_configs = 

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = espidf
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
; ESP-IDF routes compile commands through ccache when it is installed. Local
; builds without ccache remain valid; target setup installs it persistently.
board_build.cmake_extra_args = -DCCACHE_ENABLE=1
board_build.partitions = partitions.csv

; Build flags - Use UART Serial instead of USB CDC for debugging
; Use DEBUG=1 environment variable to enable verbose logging
; Example: DEBUG=1 pio run --target upload
build_flags = 
    -O2
    -std=gnu++17

extra_scripts = pre:extra_script.py

; Upload settings
upload_speed = 460800
monitor_speed = 115200

; Monitor settings
monitor_raw = yes

; Auto-detect port (PlatformIO will find it)
; If detection fails, uncomment and specify manually:
; upload_port = /dev/cu.usbmodem*
; monitor_port = /dev/cu.usbmodem*

[env:esp32-s3-devkitc-1-local-canary]
extends = env:esp32-s3-devkitc-1
build_flags =
    -O2
    -std=gnu++17
    -DLEDGRID_ENABLE_LOCAL_BACKGROUND=1
    -DLEDGRID_ENABLE_INSTALLATION_PROFILES=1

[env:esp32-s3-devkitc-1-native-canary]
extends = env:esp32-s3-devkitc-1
board_build.cmake_extra_args =
    -DCCACHE_ENABLE=1
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.native.defaults"
build_flags =
    -O2
    -std=gnu++17
    -DLEDGRID_ENABLE_LOCAL_BACKGROUND=1
    -DLEDGRID_ENABLE_INSTALLATION_PROFILES=1
    -DLEDGRID_ENABLE_RECEIVER_NATIVE_MODULES=1

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -DLEDGRID_ENABLE_LOCAL_BACKGROUND=1
    -DLEDGRID_ENABLE_INSTALLATION_PROFILES=1
    -DLEDGRID_ENABLE_RECEIVER_NATIVE_MODULES=1
build_src_filter =
    +<ws2812_encoder.cpp>
    +<protocol.cpp>
    +<startup_animation.cpp>
    +<animation_pipeline_contract.cpp>
    +<installation_profile.cpp>
    +<installation_profile_store.cpp>
    +<receiver_optics.cpp>
    +<receiver_runtime.cpp>
    +<sha256.cpp>
    +<native_module.cpp>
    +<native_module_filesystem.cpp>
